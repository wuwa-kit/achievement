name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: achievement-export
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag') { throw '请选择标签运行 release 工作流。' }
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath artifacts/release-notes.md
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: achievement-export/global.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish compressed standalone desktop
        run: dotnet publish Wuwa.Desktop -c Release --self-contained true -o artifacts/app-compact
      - name: Package desktop
        run: |
          Compress-Archive -LiteralPath artifacts/app-compact/WuwaAchievementExport.exe -DestinationPath artifacts/wuwa-desktop-compact.zip
      - uses: actions/upload-artifact@v6
        with:
          name: wuwa-desktop-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            achievement-export/artifacts/app-compact/WuwaAchievementExport.exe
            achievement-export/artifacts/wuwa-desktop-compact.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            'artifacts/app-compact/WuwaAchievementExport.exe',
            'artifacts/wuwa-desktop-compact.zip',
            '--verify-tag', '--title', $env:RELEASE_TAG,
            '--notes-file', 'artifacts/release-notes.md'
          )
          if ($env:RELEASE_TAG -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
