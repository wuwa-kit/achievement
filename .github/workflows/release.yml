name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: achievement-export
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag') { throw '请选择标签运行 release 工作流。' }
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath artifacts/release-notes.md
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Publish Windows desktop executables
        run: mise exec -- node scripts/dotnet.ts publish-desktop
      - name: Name release executables
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseDir = 'artifacts/release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $sources = @(
            'artifacts/app-compact/WuwaAchievementExport.exe',
            'artifacts/app-lite/WuwaAchievementExport-Lite.exe'
          )
          foreach ($source in $sources) {
            $file = Get-Item -LiteralPath $source
            $name = "$($file.BaseName)-$($env:RELEASE_TAG)$($file.Extension)"
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $releaseDir $name)
          }
      - uses: actions/upload-artifact@v6
        with:
          name: wuwa-desktop-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: achievement-export/artifacts/release/*.exe
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--title', $env:RELEASE_TAG,
            '--notes-file', 'artifacts/release-notes.md'
          )
          $releaseArgs += Get-ChildItem -LiteralPath artifacts/release -File -Filter '*.exe' |
            ForEach-Object FullName
          if ($env:RELEASE_TAG -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
