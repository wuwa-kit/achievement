name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: achievement-export
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag') { throw '请选择标签运行 release 工作流。' }
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath artifacts/release-notes.md -UpdateNotesPath artifacts/update-notes.txt
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm -w typecheck:research
      - name: Publish Windows desktop executables
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise exec -- node scripts/dotnet.ts publish-desktop
      - name: Prepare release assets and update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseDir = 'artifacts/release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $sources = @{
            standard = 'artifacts/app-compact/WuwaAchievementExport.exe'
            lite = 'artifacts/app-lite/WuwaAchievementExport-Lite.exe'
          }
          $assets = @{}
          foreach ($edition in $sources.Keys) {
            $file = Get-Item -LiteralPath $sources[$edition]
            $baseName = if ($edition -eq 'standard') { "$($file.BaseName)-Full" } else { $file.BaseName }
            $name = "$baseName-$($env:RELEASE_TAG)$($file.Extension)"
            $destination = Join-Path $releaseDir $name
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            $assets[$edition] = @{
              fileName = $name
              size = $file.Length
              sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          @{
            schemaVersion = 1
            version = $env:RELEASE_TAG
            notes = (Get-Content -LiteralPath artifacts/update-notes.txt -Raw -Encoding utf8).Trim()
            assets = $assets
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $releaseDir 'update.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v6
        with:
          name: wuwa-desktop-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            achievement-export/artifacts/release/*.exe
            achievement-export/artifacts/release/update.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--title', $env:RELEASE_TAG,
            '--notes-file', 'artifacts/release-notes.md'
          )
          $releaseArgs += Get-ChildItem -LiteralPath artifacts/release -File -Filter '*.exe' |
            ForEach-Object FullName
          $releaseArgs += 'artifacts/release/update.json'
          if ($env:RELEASE_TAG -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
