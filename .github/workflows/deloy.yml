name: deloy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,pnpm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm --filter achievement-website build
      - uses: actions/upload-artifact@v6
        with:
          name: website
          path: achievement-website/dist/
          if-no-files-found: error

      - name: Deploy Cloudflare Pages
        run: >-
          mise exec -- pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4
          pages deploy achievement-website/dist --project-name=wuwa-achievement-export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: deploy netlify
        uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: achievement-website/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: false
          enable-commit-comment: false
