name: deloy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,pnpm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ github.event.repository.private == false }}
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Initialize jsDelivr deployment
        if: github.event.repository.private == false
        run: mise exec -- node scripts/deploy.ts init
      - run: mise exec -- pnpm --filter achievement-website build
      - name: Publish website to the CDN tag
        if: github.event.repository.private == false
        run: mise exec -- node scripts/deploy.ts publish
      - uses: actions/upload-artifact@v6
        with:
          name: website
          path: achievement-website/dist/
          if-no-files-found: error

      - name: Deploy Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          mise exec -- pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4
          pages deploy achievement-website/dist --project-name=wuwa-achievement-export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Keep the latest three CDN tags
        if: github.event.repository.private == false
        run: mise exec -- node scripts/deploy.ts cleanup
